name: Public EEG reproduction
on:
  pull_request:
    paths:
      - '.github/workflows/public-data.yml'
      - 'scripts/reproduce_public.py'
  workflow_dispatch:
    inputs:
      extended:
        description: Include full robustness and epoch replay studies
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: eeg-fatigue-download
      - name: Reproduce subject-held-out baseline
        env:
          EXTENDED: ${{ inputs.extended }}
        run: |
          args=()
          if [[ "$EXTENDED" == true ]]; then args+=(--extended); fi
          python scripts/reproduce_public.py --output tmp/public-evidence "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-eeg-evidence
          path: tmp/public-evidence/
          retention-days: 14
