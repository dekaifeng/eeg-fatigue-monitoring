[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-fatigue-monitoring"
version = "0.1.0"
description = "Reproducible EEG fatigue-monitoring research prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Feng Dekai"}]
dependencies = [
  "matplotlib>=3.7,<4",
  "mne>=1.6,<2",
  "numpy>=2,<3",
  "pandas>=2,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
eeg-fatigue-study = "eeg_fatigue.cli:main"
eeg-fatigue-download = "eeg_fatigue.download_cli:main"
eeg-fatigue-real-study = "eeg_fatigue.real_cli:main"
eeg-fatigue-robustness = "eeg_fatigue.robustness_cli:main"
eeg-fatigue-replay = "eeg_fatigue.streaming_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
